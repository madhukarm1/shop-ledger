<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e56">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shop Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
:root{
  --bg:#eef1ea; --surface:#ffffff; --surface-2:#f5f6f0; --border:#dde1d4;
  --text:#232620; --muted:#6b7062; --muted-2:#8b9082;
  --accent:#1b5e56; --accent-2:#164a44; --accent-soft:#dcebe7;
  --warm:#e2963a; --warm-2:#c97e26; --warm-soft:#fbe8cc;
  --success:#2f8f5c; --success-soft:#dff2e6;
  --warning:#c98a1d; --warning-soft:#fbedd1;
  --danger:#c1443c; --danger-soft:#f8dedb;
  --shadow:0 1px 2px rgba(35,38,32,.06),0 6px 16px rgba(35,38,32,.07);
  --radius:12px; --radius-sm:8px;
  --font-display:'Newsreader',Georgia,serif;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1c17; --surface:#22251f; --surface-2:#282b23; --border:#3a3e33;
    --text:#e9ece1; --muted:#a5aa99; --muted-2:#7d8271;
    --accent:#5fb3a3; --accent-2:#79c4b5; --accent-soft:#233c37;
    --warm:#eeb15e; --warm-2:#f4c47e; --warm-soft:#3d3120;
    --success:#5fb37f; --success-soft:#1f3527;
    --warning:#e0ad4f; --warning-soft:#3d3320;
    --danger:#e2776d; --danger-soft:#3d2422;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1a1c17; --surface:#22251f; --surface-2:#282b23; --border:#3a3e33;
  --text:#e9ece1; --muted:#a5aa99; --muted-2:#7d8271;
  --accent:#5fb3a3; --accent-2:#79c4b5; --accent-soft:#233c37;
  --warm:#eeb15e; --warm-2:#f4c47e; --warm-soft:#3d3120;
  --success:#5fb37f; --success-soft:#1f3527;
  --warning:#e0ad4f; --warning-soft:#3d3320;
  --danger:#e2776d; --danger-soft:#3d2422;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; text-wrap:balance;}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit; font-size:inherit;}
::selection{background:var(--accent-soft);}
[hidden]{display:none!important;}

/* ---------- layout ---------- */
html,body,#app{height:100%;}
.app-shell{display:flex; height:100vh; overflow:hidden;}
.sidebar{
  width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100%; overflow-y:auto;
}
.sidebar-brand{
  padding:20px 18px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--border);
}
.brand-mark{
  width:34px; height:34px; border-radius:9px; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:600; font-size:17px; flex-shrink:0;
}
.brand-text{min-width:0;}
.brand-text .name{font-family:var(--font-display); font-weight:600; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.brand-text .sub{font-size:11px; color:var(--muted); letter-spacing:.03em;}
.nav{padding:10px; flex:1; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--radius-sm);
  color:var(--muted); cursor:pointer; margin-bottom:2px; font-size:13.5px; font-weight:500; border:none; background:none; width:100%; text-align:left;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-2); font-weight:600;}
:root[data-theme="dark"] .nav-item.active, @media (prefers-color-scheme:dark){}
.nav-item.active svg{color:var(--accent);}
.sidebar-foot{padding:12px; border-top:1px solid var(--border);}
.main{flex:1; display:flex; flex-direction:column; min-width:0; height:100%; overflow-y:auto;}
.topbar{
  height:60px; flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 22px; position:sticky; top:0; z-index:30;
}
.topbar-title{font-family:var(--font-display); font-size:19px; font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.topbar-date{font-size:12.5px; color:var(--muted); font-family:var(--font-mono);}
.user-chip{display:flex; align-items:center; gap:9px; padding:5px 6px 5px 10px; border-radius:20px; background:var(--surface-2);}
.user-chip .avatar{width:26px; height:26px; border-radius:50%; background:var(--warm); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600;}
.user-chip .u-name{font-size:12.5px; font-weight:600; line-height:1.1;}
.user-chip .u-role{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
.menu-btn{display:none; background:none; border:none; color:var(--text); padding:8px; cursor:pointer;}
.menu-btn svg{width:22px; height:22px;}
.content{padding:22px; flex:1; max-width:1400px; width:100%;}
.sidebar-backdrop{display:none;}

@media (max-width:900px){
  .sidebar{position:fixed; top:0; left:0; bottom:0; z-index:40; transform:translateX(-100%); transition:transform .2s ease;}
  .sidebar.open{transform:translateX(0); box-shadow:var(--shadow);}
  .menu-btn{display:inline-flex; align-items:center;}
  .sidebar-backdrop.open{display:block; position:fixed; inset:0; background:rgba(20,22,17,.4); z-index:39;}
  .content{padding:14px;}
  .topbar{padding:0 12px;}
}

/* ---------- components ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--surface); color:var(--text); cursor:pointer; font-weight:600; font-size:13px;
  white-space:nowrap;
}
.btn svg{width:15px; height:15px;}
.btn:hover{border-color:var(--muted-2);}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-2); border-color:var(--accent-2);}
.btn-warm{background:var(--warm); border-color:var(--warm); color:#241a06;}
.btn-warm:hover{background:var(--warm-2); border-color:var(--warm-2);}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 10px; font-size:12px;}
.btn-block{width:100%; justify-content:center;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px;
  border:1px solid transparent; background:transparent; color:var(--muted); cursor:pointer;
}
.icon-btn svg{width:16px; height:16px;}
.icon-btn:hover{background:var(--surface-2); color:var(--text);}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:18px 20px;}
.card-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap;}
.card-head h3{font-size:15px;}
.section-title{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; margin:0 0 10px;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:20px;}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
.stat-tile .st-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:6px;}
.stat-tile .st-value{font-family:var(--font-mono); font-size:23px; font-weight:600; margin-top:8px;}
.stat-tile .st-sub{font-size:11.5px; color:var(--muted-2); margin-top:3px;}
.stat-tile.warn .st-value{color:var(--warning);}
.stat-tile.bad .st-value{color:var(--danger);}
.stat-tile.good .st-value{color:var(--success);}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
td{padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto;}
.table-empty{padding:36px 20px; text-align:center; color:var(--muted);}
.table-empty svg{width:30px; height:30px; margin-bottom:8px; opacity:.6;}

.badge{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:.01em;}
.badge-cash{background:var(--success-soft); color:var(--success);}
.badge-upi{background:var(--accent-soft); color:var(--accent-2);}
.badge-card{background:var(--warm-soft); color:var(--warm-2);}
.badge-udhaar{background:var(--danger-soft); color:var(--danger);}
.badge-admin{background:var(--warm-soft); color:var(--warm-2);}
.badge-management{background:var(--accent-soft); color:var(--accent-2);}
.badge-ok{background:var(--success-soft); color:var(--success);}
.badge-low{background:var(--danger-soft); color:var(--danger);}
.badge-muted{background:var(--surface-2); color:var(--muted);}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.form-grid.one{grid-template-columns:1fr;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label{font-size:12px; font-weight:600; color:var(--muted);}
.field input,.field select,.field textarea{
  padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text);
  font-family:inherit; font-size:13.5px; width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--accent);}
.field .hint{font-size:11px; color:var(--muted-2);}
.field-inline{display:flex; align-items:center; gap:8px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto;}
.tab{padding:9px 4px; margin-right:16px; border:none; background:none; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
.tab.active{color:var(--accent-2); border-color:var(--accent);}
.pill-group{display:flex; gap:6px; flex-wrap:wrap;}
.pill{padding:6px 13px; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer;}
.pill.active{background:var(--accent); border-color:var(--accent); color:#fff;}

.modal-backdrop{position:fixed; inset:0; background:rgba(20,22,17,.45); display:flex; align-items:flex-start; justify-content:center; z-index:100; padding:5vh 16px; overflow-y:auto;}
.modal{background:var(--surface); border-radius:var(--radius); width:100%; max-width:520px; box-shadow:var(--shadow); max-height:90vh; display:flex; flex-direction:column;}
.modal.wide{max-width:760px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
.modal-body{padding:20px; overflow-y:auto;}
.modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

.toast-root{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--text); color:var(--bg); padding:11px 16px; border-radius:8px; font-size:13px; font-weight:500; box-shadow:var(--shadow); animation:toastIn .18s ease;}
.toast.err{background:var(--danger);color:#fff;}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- login ---------- */
.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:
  radial-gradient(circle at 15% 20%, var(--accent-soft), transparent 45%),
  radial-gradient(circle at 85% 80%, var(--warm-soft), transparent 45%), var(--bg);}
.login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:32px 30px;}
.login-brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
.login-brand .brand-mark{width:52px; height:52px; font-size:24px; border-radius:14px;}
.login-brand h1{font-size:21px;}
.login-brand p{color:var(--muted); font-size:12.5px; margin:2px 0 0;}
.login-demo{margin-top:18px; padding:12px 14px; background:var(--surface-2); border-radius:10px; font-size:11.5px; color:var(--muted); line-height:1.6;}
.login-demo b{color:var(--text);}
.login-error{background:var(--danger-soft); color:var(--danger); padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px; font-weight:600;}

/* ---------- POS ---------- */
.pos-grid{display:grid; grid-template-columns:1fr 360px; gap:16px; align-items:start;}
@media (max-width:900px){.pos-grid{grid-template-columns:1fr;}}
.barcode-bar{display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid var(--accent); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:12px;}
.barcode-bar svg{width:20px; height:20px; color:var(--accent); flex-shrink:0;}
.barcode-bar input{flex:1; border:none; background:none; font-family:var(--font-mono); font-size:14px; color:var(--text); padding:2px 0;}
.barcode-bar input:focus{outline:none;}
.item-toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.item-search{flex:1; min-width:180px; position:relative;}
.item-search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted);}
.item-search input{padding-left:33px;}
.item-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.item-card{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; text-align:left;}
.item-card:hover{border-color:var(--accent);}
.item-card .ic-name{font-weight:600; font-size:13px; line-height:1.3; margin-bottom:6px; min-height:34px;}
.item-card .ic-cat{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em;}
.item-card .ic-row{display:flex; align-items:baseline; justify-content:space-between; margin-top:8px;}
.item-card .ic-price{font-family:var(--font-mono); font-weight:600; color:var(--accent-2);}
.item-card .ic-stock{font-size:10.5px; color:var(--muted-2);}
.item-card.out{opacity:.5; cursor:not-allowed;}
.item-card.low .ic-stock{color:var(--danger);}

.cart-panel{position:sticky; top:76px;}
.cart-line{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border);}
.cart-line .cl-name{flex:1; min-width:0;}
.cart-line .cl-name .n{font-weight:600; font-size:12.5px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cart-line .cl-name .p{font-size:11px; color:var(--muted); font-family:var(--font-mono);}
.qty-ctl{display:flex; align-items:center; gap:5px;}
.qty-ctl button{width:22px; height:22px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.qty-ctl button svg{width:11px; height:11px;}
.qty-ctl .q{width:24px; text-align:center; font-family:var(--font-mono); font-weight:600; font-size:12.5px;}
.cl-total{width:64px; text-align:right; font-family:var(--font-mono); font-weight:600; font-size:12.5px;}
.cart-empty{padding:26px 10px; text-align:center; color:var(--muted); font-size:12.5px;}
.cart-summary-row{display:flex; justify-content:space-between; padding:5px 0; font-size:13px;}
.cart-summary-row.total{font-weight:700; font-size:16px; padding-top:10px; border-top:1px solid var(--border); margin-top:6px;}
.pay-splits{display:flex; flex-direction:column; gap:8px;}
.pay-split-row{display:flex; align-items:center; gap:6px;}
.pay-split-row .ps-mode{flex:1.1; min-width:0; padding:7px 8px; font-size:12.5px;}
.pay-split-row .ps-acc{flex:1.3; min-width:0; padding:7px 8px; font-size:12.5px;}
.pay-split-row .ps-acc-note{flex:1.3; min-width:0;}
.pay-split-row .ps-amt{width:86px; flex-shrink:0; padding:7px 8px; font-family:var(--font-mono); font-size:12.5px;}
.purchase-line{display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
.purchase-line select,.purchase-line input{padding:8px 9px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--text); font-size:13px;}

/* ---------- receipt / print ---------- */
.receipt{font-family:var(--font-mono); font-size:12.5px; max-width:320px; margin:0 auto;}
.receipt-shop{font-family:var(--font-display); font-weight:600; font-size:16px; text-align:center;}
.receipt-meta{text-align:center; color:var(--muted); font-size:11px;}
.receipt-row{display:flex; justify-content:space-between; padding:2px 0;}
.receipt-row.total{font-weight:700; font-size:14px;}
.receipt-table{width:100%; font-size:11.5px;}
.receipt-table th,.receipt-table td{padding:3px 2px; border:none;}
.receipt-thanks{text-align:center; margin-top:8px; font-style:italic; color:var(--muted);}
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea,#printArea *{visibility:visible;}
  #printArea{display:block; position:absolute; top:0; left:0; width:100%;}
}

.empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
.empty-state svg{width:38px; height:38px; margin-bottom:12px; opacity:.5;}
.empty-state h4{font-size:15px; color:var(--text); margin-bottom:5px;}
.empty-state p{font-size:12.5px; margin:0 0 14px;}

.flex-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.muted{color:var(--muted);}
.mono{font-family:var(--font-mono);}
.right{text-align:right;}
.mt-0{margin-top:0;}
.grow{flex:1;}
.small{font-size:12px;}
.warn-banner{background:var(--warning-soft); color:var(--warning); padding:10px 14px; border-radius:8px; font-size:12.5px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
.warn-banner svg{width:16px; height:16px; flex-shrink:0;}
hr.sep{border:none; border-top:1px solid var(--border); margin:14px 0;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>
<div id="printArea"></div>

<script>
/* ================= constants ================= */
const STORAGE_KEY='shopLedgerDB_v1';
const SESSION_KEY='shopLedgerSession_v1';
const EXPENSE_CATEGORIES=['Rent','Salary/Wages','Electricity Bill','Stock Purchase','Maintenance','Transport','Miscellaneous'];
const PAYMENT_MODES=[{id:'cash',label:'Cash'},{id:'upi',label:'UPI'},{id:'card',label:'Card'},{id:'udhaar',label:'Udhaar'}];
const ITEM_CATEGORIES=['Notebooks','Pens & Pencils','Paper & Files','Art Supplies','Office Supplies','Instruments'];

   Fill these in with your own Firebase project's config (Firebase Console

function cloudConfigured(){return FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey!=='YOUR_API_KEY';}
function initFirebase(){
  if(!cloudConfigured()||typeof firebase==='undefined')return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbDB=firebase.firestore();
    cloudStatus='connecting';
    firebase.auth().signInAnonymously().then(()=>{cloudReady=true; cloudStatus='connected'; onCloudReady();}).catch(()=>{cloudReady=false; cloudStatus='error';});

function genShopCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<10;i++)s+=chars[Math.floor(Math.random()*chars.length)];
  return s.slice(0,5)+'-'+s.slice(5);
}

function cloudCoreData(){
  return {shopInfo:DB.shopInfo, users:DB.users, accounts:DB.accounts, items:DB.items, customers:DB.customers,
    contacts:DB.contacts, fds:DB.fds, udharEntries:DB.udharEntries, udhaarPayments:DB.udhaarPayments,

let cloudPushTimer=null;
function queueCloudPush(){
  if(!cloudReady||!DB.shopCode)return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(()=>{
    fbDB.collection('shops').doc(DB.shopCode).set(cloudCoreData(),{merge:true}).catch(()=>{});
  },900);
}
function pushRecordToCloud(kind,record){
  if(!cloudReady||!DB.shopCode)return;
  fbDB.collection('shops').doc(DB.shopCode).collection(kind).doc(record.id).set(record).catch(()=>{});
}
function deleteRecordFromCloud(kind,id){
  if(!cloudReady||!DB.shopCode)return;
  fbDB.collection('shops').doc(DB.shopCode).collection(kind).doc(id).delete().catch(()=>{});
}
async function pullFromCloud(shopCode){
  const snap=await fbDB.collection('shops').doc(shopCode).get();
  if(!snap.exists)throw new Error('not_found');
  const core=snap.data();
  const recs={};
  for(const kind of CLOUD_RECORD_COLLECTIONS){
    const qs=await fbDB.collection('shops').doc(shopCode).collection(kind).get();
    recs[kind]=qs.docs.map(d=>d.data());
  }
  return Object.assign(blankDB(),core,recs,{shopCode,setupComplete:true});
}
function normLicense(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'');}
async function claimLicense(code,shopCode){
  const ref=fbDB.collection('licenses').doc(code);
  const snap=await ref.get();
  if(!snap.exists)throw new Error('invalid');
  const st=snap.data().status;
  if(st==='disabled')throw new Error('disabled');
  if(st!=='unused')throw new Error('used');
  await ref.update({status:'used',shopCode:shopCode,usedAt:Date.now()});
}
let licenseBlocked=false;
function checkLicense(){
  if(!cloudReady||!DB.licenseCode)return;
  fbDB.collection('licenses').doc(DB.licenseCode).get().then(snap=>{
    const blocked=snap.exists&&snap.data().status==='disabled';
    if(blocked!==licenseBlocked){licenseBlocked=blocked; render();}
  }).catch(()=>{});
}
function viewLicenseBlocked(){

    '<div class="login-brand"><div class="brand-mark">'+icon('alert',26)+'</div><h1>License Disabled</h1></div>'+
    '<p class="muted">This shop&#39;s license has been disabled. Please contact the person who sold you this app.</p>'+
    '<button class="btn btn-block" onclick="checkLicense()">Check Again</button></div></div>';
}
function onCloudReady(){
  if(!DB.shopCode){if(session)render(); return;}
  pullFromCloud(DB.shopCode).then(cloudDB=>{
    DB=migrateDB(cloudDB);
    localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));
    render(); checkLicense();
  }).catch(()=>{if(session)render();});
}
function cloudStatusTagHTML(){
  if(!cloudConfigured())return '';
  const map={connecting:['Syncing…','warn'],connected:['Cloud Synced','good'],error:['Sync Error','bad'],off:['',''] };
  const [label,kind]=map[cloudStatus]||['',''];
  if(!label)return '<span></span>';
  return '<span class="badge '+(kind==='good'?'badge-ok':kind==='bad'?'badge-low':'badge-muted')+'" style="margin-left:8px;">'+label+'</span>';
}

/* ================= utils ================= */
function uid(p){return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(n){
  n=Number(n)||0; const neg=n<0; n=Math.abs(n);
  const fixed=n.toFixed(2); let [ip,dec]=fixed.split('.');
  let last3=ip.slice(-3), rest=ip.slice(0,-3);
  if(rest) rest=rest.replace(/\B(?=(\d{2})+(?!\d))/g,',');
  const formatted=(rest?rest+',':'')+last3;
  return (neg?'-':'')+'₹'+formatted+'.'+dec;
}
function fmtDate(d){d=new Date(d); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(d){d=new Date(d); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}
function todayISO(){return new Date().toISOString().slice(0,10);}
function startOfDay(d){d=new Date(d);d.setHours(0,0,0,0);return d;}
function endOfDay(d){d=new Date(d);d.setHours(23,59,59,999);return d;}
function startOfWeek(d){d=new Date(d);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return startOfDay(d);}
function startOfMonth(d){d=new Date(d);d.setDate(1);return startOfDay(d);}
function getRange(preset,from,to){
  const now=new Date();
  if(preset==='today')return [startOfDay(now),endOfDay(now)];
  if(preset==='week')return [startOfWeek(now),endOfDay(now)];
  if(preset==='month')return [startOfMonth(now),endOfDay(now)];
  if(preset==='all')return [new Date(2000,0,1),endOfDay(now)];
  if(preset==='custom')return [startOfDay(new Date(from||now)),endOfDay(new Date(to||now))];
  return [startOfDay(now),endOfDay(now)];
}
function inRange(dateStr,range){const t=new Date(dateStr).getTime(); return t>=range[0].getTime()&&t<=range[1].getTime();}
function debounce(fn,ms){let t;return function(...a){clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms);};}

function migrateDB(db){
  if(!db.purchases)db.purchases=[];
  if(!db.contacts)db.contacts=[];
  if(!db.udharEntries)db.udharEntries=[];
  if(!db.reminders)db.reminders=[];
  if(!db.billCounter)db.billCounter=1;
  if(typeof db.setupComplete!=='boolean')db.setupComplete=true;
  if(typeof db.shopCode==='undefined')db.shopCode=null;
  if(typeof db.licenseCode==='undefined')db.licenseCode=null;
  db.contacts.forEach(c=>{if(typeof c.remark!=='string')c.remark='';});
  db.items.forEach(i=>{if(typeof i.barcode!=='string')i.barcode='';});
  return db;
}

function currentUser(){return DB.users.find(u=>u.id===(session&&session.userId));}
function isAdmin(){const u=currentUser(); return u&&u.role==='admin';}
function userName(id){const u=DB.users.find(x=>x.id===id); return u?u.name:'—';}
function customerName(id){if(!id)return 'Walk-in Customer'; const c=DB.customers.find(x=>x.id===id); return c?c.name:'Walk-in Customer';}
function accountName(id){const a=DB.accounts.find(x=>x.id===id); return a?a.name:'—';}
function itemById(id){return DB.items.find(x=>x.id===id);}

function billsInRange(range){return DB.bills.filter(b=>inRange(b.date,range));}
function expensesInRange(range){return DB.expenses.filter(e=>inRange(e.date,range));}
function purchasesInRange(range){return DB.purchases.filter(p=>inRange(p.date,range));}
function billPayments(b){
  if(b.payments)return b.payments;
  return [{mode:b.paymentMode,accountId:b.accountId,amount:b.paymentMode==='udhaar'?(b.udhaarAmount||0):(b.amountPaid||b.total)}];
}

function salesSummary(range){
  const bills=billsInRange(range);
  const total=bills.reduce((s,b)=>s+b.total,0);
  const byMode={cash:0,upi:0,card:0,udhaar:0};
  bills.forEach(b=>billPayments(b).forEach(p=>{byMode[p.mode]=(byMode[p.mode]||0)+p.amount;}));
  return {count:bills.length, total, byMode, avg: bills.length? total/bills.length:0};
}
function accountTotals(range){
  const bills=billsInRange(range), exps=expensesInRange(range), purs=purchasesInRange(range);
  return DB.accounts.map(a=>{
    let inflow=0;
    bills.forEach(b=>billPayments(b).forEach(p=>{if(p.accountId===a.id)inflow+=p.amount;}));
    const outExp=exps.filter(e=>e.accountId===a.id).reduce((s,e)=>s+e.amount,0);
    const outPur=purs.filter(p=>p.accountId===a.id).reduce((s,p)=>s+p.total,0);
    return {account:a, inflow, outflow:outExp+outPur, net:inflow-(outExp+outPur)};
  });
}
function topItems(range,limit){
  const map={};
  billsInRange(range).forEach(b=>b.items.forEach(li=>{
    const key=li.itemId||('manual:'+li.name);
    if(!map[key])map[key]={name:li.name,qty:0,revenue:0};
    map[key].qty+=li.qty; map[key].revenue+=li.qty*li.price;
  }));
  return Object.values(map).sort((a,b)=>b.revenue-a.revenue).slice(0,limit||8);
}
function cashierSales(range){
  const map={};
  billsInRange(range).forEach(b=>{
    if(!map[b.cashierUserId])map[b.cashierUserId]={name:userName(b.cashierUserId),count:0,total:0};
    map[b.cashierUserId].count++; map[b.cashierUserId].total+=b.total;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function setHtmlPreserveFocus(container,html){
  const active=document.activeElement;
  const isField=active&&(active.tagName==='INPUT'||active.tagName==='TEXTAREA'||active.tagName==='SELECT')&&active.id&&container.contains(active);
  const focusId=isField?active.id:null;
  const selStart=isField&&typeof active.selectionStart==='number'?active.selectionStart:null;
  const selEnd=isField&&typeof active.selectionEnd==='number'?active.selectionEnd:null;
  container.innerHTML=html;
  if(focusId){
    const again=document.getElementById(focusId);
    if(again){again.focus(); if(selStart!==null){try{again.setSelectionRange(selStart,selEnd);}catch(e){}}}
  }
}
function renderContent(){
  const el=document.getElementById('content');
  const map={dashboard:viewDashboard,billing:viewBilling,bills:viewBills,inventory:viewInventory,customers:viewCustomers,
    contacts:viewContacts,reminders:viewReminders,personalUdhar:viewPersonalUdhar,accounts:viewAccounts,expenses:viewExpenses,fd:viewFD,purchases:viewPurchases,reports:viewReports,staff:viewStaff,settings:viewSettings};

}

    '</div>'+

function onBarcodeKey(e,el){
  if(e.key!=='Enter'&&e.key!=='Tab')return;
  e.preventDefault();
  const code=el.value.trim();
  if(!code)return;
  const item=DB.items.find(i=>i.barcode&&i.barcode===code);
  if(!item){toast('No item found for barcode '+code,true); el.value=''; el.focus(); return;}
  if(item.stock<=0){toast('Out of stock: '+item.name,true); el.value=''; el.focus(); return;}
  addToCart(item.id);
}
function itemCard(i){
  const low=i.stock<=i.lowStockThreshold, out=i.stock<=0;
  return '<button class="item-card'+(out?' out':'')+(low&&!out?' low':'')+'" '+(out?'disabled':'data-action="addToCart" data-id="'+i.id+'"')+'>'+
    '<div class="ic-cat">'+esc(i.category)+'</div>'+
    '<div class="ic-name">'+esc(i.name)+'</div>'+
    '<div class="ic-row"><span class="ic-price">'+fmtMoney(i.price)+'</span><span class="ic-stock">'+(out?'Out of stock':i.stock+' '+esc(i.unit))+'</span></div>'+
  '</button>';
}

       '<div class="qty-ctl"><button data-action="cartQty" data-idx="'+idx+'" data-d="-1">'+icon('minus')+'</button><span class="q">'+l.qty+'</span><button data-action="cartQty" data-idx="'+idx+'" data-d="1">'+icon('plus')+'</button></div>'+
       '<div class="cl-total num">'+fmtMoney(cartLineTotal(l))+'</div>'+

    '<hr class="sep">'+
    '<div class="field"><label>Discount (₹)</label><input id="cartDiscountInput" type="text" inputmode="decimal" value="'+state.cartDiscount+'" oninput="setCartDiscount(this.value)"></div>'+
    '<div class="cart-summary-row"><span>Subtotal</span><span class="num">'+fmtMoney(sub)+'</span></div>'+
    '<div class="cart-summary-row"><span>Discount</span><span class="num">-'+fmtMoney(state.cartDiscount||0)+'</span></div>'+
    '<div class="cart-summary-row total"><span>Total</span><span class="num">'+fmtMoney(total)+'</span></div>'+
    '<div class="field" style="margin-top:12px;"><label>Payment</label>'+paymentSplitUI(total)+'</div>'+
    '<button class="btn btn-primary btn-block" style="margin-top:8px;" data-action="completeBill" '+(!state.cart.length?'disabled':'')+'>'+icon('check')+' Complete Bill · '+fmtMoney(total)+'</button>'+
   '</div>';
}
function paymentSplitUI(total){
  const assigned=state.cartPayments.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const remaining=Math.round((total-assigned)*100)/100;
  let html='<div class="pay-splits">'+state.cartPayments.map((p,idx)=>{
    return '<div class="pay-split-row">'+
      '<select class="ps-mode" onchange="setPaySplitMode('+idx+',this.value)">'+PAYMENT_MODES.map(m=>'<option value="'+m.id+'" '+(p.mode===m.id?'selected':'')+'>'+m.label+'</option>').join('')+'</select>'+
      (p.mode!=='udhaar'?
        '<select class="ps-acc" onchange="setPaySplitAccount('+idx+',this.value)">'+DB.accounts.map(a=>'<option value="'+a.id+'" '+(p.accountId===a.id?'selected':'')+'>'+esc(a.name)+'</option>').join('')+'</select>'
        : '<span class="muted small ps-acc-note">→ customer udhaar</span>')+
      '<input class="ps-amt" id="paySplitAmt'+idx+'" type="text" inputmode="decimal" value="'+p.amount+'" oninput="setPaySplitAmount('+idx+',this.value)">'+
      (state.cartPayments.length>1? '<button type="button" class="icon-btn" data-action="removePaySplit" data-idx="'+idx+'">'+icon('close')+'</button>' : '<span style="width:32px;flex-shrink:0;"></span>')+
    '</div>';
  }).join('')+'</div>'+
   '<button type="button" class="btn btn-sm" style="margin-top:8px;" data-action="addPaySplit">'+icon('plus')+' Split Payment</button>'+
   '<div class="pay-remaining" style="margin-top:8px;font-size:12.5px;font-weight:600;'+(Math.abs(remaining)>0.004?'color:var(--danger);':'color:var(--success);')+'">'+
    (Math.abs(remaining)<0.005? icon('check',14)+' Fully assigned' : (remaining>0? 'Remaining to assign: '+fmtMoney(remaining) : 'Over-assigned by '+fmtMoney(-remaining)))+
   '</div>'+
   (state.cartPayments.some(p=>p.mode==='udhaar'&&Number(p.amount)>0)? '<div class="warn-banner" style="margin-top:8px;">'+icon('alert')+' Udhaar portion will be added to the customer&#39;s credit balance.</div>' : '');
  return html;
}
function setCartCustomer(v){state.cartCustomer=v;}
function syncSinglePayment(){
  if(state.cartPayments.length===1){state.cartPayments[0].amount=cartTotal();}
}
function setCartDiscount(v){state.cartDiscount=Math.max(0,Number(v)||0); syncSinglePayment(); renderContent();}
function addToCart(id){
  const item=itemById(id); if(!item||item.stock<=0)return;
  const existing=state.cart.find(l=>l.itemId===id);
  const qtyInCart=existing?existing.qty:0;
  if(qtyInCart+1>item.stock){toast('Not enough stock of '+item.name,true); return;}
  if(existing)existing.qty++; else state.cart.push({itemId:id,name:item.name,unit:item.unit,price:item.price,qty:1});
  syncSinglePayment(); renderContent();
}
function cartQty(idx,d){
  const l=state.cart[idx]; if(!l)return;
  const item=itemById(l.itemId);
  const nq=l.qty+d;
  if(nq<=0){state.cart.splice(idx,1);}
  else if(item&&nq>item.stock){toast('Only '+item.stock+' '+item.unit+' in stock',true); return;}
  else l.qty=nq;
  syncSinglePayment(); renderContent();
}
function cartRemove(idx){state.cart.splice(idx,1); syncSinglePayment(); renderContent();}
function setPaySplitMode(idx,mode){
  const p=state.cartPayments[idx]; if(!p)return;
  p.mode=mode;
  if(mode==='udhaar')p.accountId=null; else if(!p.accountId)p.accountId=defaultAccountId();
  renderContent();
}
function setPaySplitAccount(idx,accId){const p=state.cartPayments[idx]; if(p)p.accountId=accId;}
function setPaySplitAmount(idx,val){const p=state.cartPayments[idx]; if(!p)return; p.amount=Math.max(0,Number(val)||0); renderContent();}
function addPaySplit(){
  const total=cartTotal();
  const assigned=state.cartPayments.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const remaining=Math.max(0,Math.round((total-assigned)*100)/100);
  state.cartPayments.push({mode:'cash',accountId:defaultAccountId(),amount:remaining});
  renderContent();
}
function removePaySplit(idx){
  state.cartPayments.splice(idx,1);
  if(!state.cartPayments.length) state.cartPayments.push({mode:'cash',accountId:defaultAccountId(),amount:cartTotal()});
  renderContent();
}

function clearCart(){state.cart=[]; state.cartDiscount=0; state.cartPayments=[{mode:'cash',accountId:defaultAccountId(),amount:0}]; renderContent();}

function completeBill(){
  if(!state.cart.length)return;
  for(const l of state.cart){if(l.manual)continue; const it=itemById(l.itemId); if(!it||it.stock<l.qty){toast('Stock changed for '+l.name+' — please review cart',true); renderContent(); return;}}
  const subtotal=cartSubtotal(), total=cartTotal();
  const payments=state.cartPayments.filter(p=>Number(p.amount)>0).map(p=>({mode:p.mode,accountId:p.mode==='udhaar'?null:p.accountId,amount:Math.round(Number(p.amount)*100)/100}));
  const assigned=payments.reduce((s,p)=>s+p.amount,0);
  if(total>0&&Math.abs(assigned-total)>0.01){toast('Payment split does not add up to the bill total — please adjust',true); return;}
  if(payments.some(p=>p.mode!=='udhaar'&&!p.accountId)){toast('Choose an account for each payment',true); return;}
  const udhaarAmount=payments.filter(p=>p.mode==='udhaar').reduce((s,p)=>s+p.amount,0);
  const customerId=state.cartCustomer||null;
  if(udhaarAmount>0&&!customerId){toast('Select a customer to bill on udhaar',true); return;}
  const billNo='INV-'+String(DB.billCounter).padStart(4,'0');
  const bill={
    id:uid('bill'), billNo, date:new Date().toISOString(),
    customerId, cashierUserId:session.userId,
    items:state.cart.map(l=>({itemId:l.itemId,name:l.name,unit:l.unit,qty:l.qty,price:l.price})),
    subtotal, discount:Number(state.cartDiscount)||0, total,
    payments, udhaarAmount,
  };
  state.cart.forEach(l=>{const it=itemById(l.itemId); if(it)it.stock-=l.qty;});
  if(udhaarAmount>0){
    const c=DB.customers.find(x=>x.id===customerId); if(c) c.udhaarBalance=(c.udhaarBalance||0)+udhaarAmount;
  }
  DB.bills.push(bill); DB.billCounter++; saveDB(); pushRecordToCloud('bills',bill);
  state.lastReceiptBillId=bill.id;
  state.cart=[]; state.cartDiscount=0; state.cartCustomer=''; state.cartPayments=[{mode:'cash',accountId:defaultAccountId(),amount:0}];
  toast('Bill '+billNo+' created');
  showReceipt(bill.id);
}
function showReceipt(billId){
  const bill=DB.bills.find(b=>b.id===billId); if(!bill)return;
  const body=receiptHTML(bill);
  openModal('Bill '+bill.billNo,body,
    '<button class="btn" data-action="closeModal">Close</button>'+
    '<button class="btn btn-primary" data-action="printBill" data-id="'+bill.id+'">'+icon('print')+' Print</button>');
}

  return '<div class="receipt">'+
   '<div class="receipt-shop">'+esc(DB.shopInfo.name||'My Shop')+'</div>'+
   (DB.shopInfo.address? '<div class="receipt-meta">'+esc(DB.shopInfo.address)+'</div>':'')+
   ((DB.shopInfo.phone||DB.shopInfo.gst)? '<div class="receipt-meta">'+(DB.shopInfo.phone?'Ph: '+esc(DB.shopInfo.phone)+' ':'')+(DB.shopInfo.gst?'GSTIN: '+esc(DB.shopInfo.gst):'')+'</div>':'')+
   '<hr class="sep"><div class="receipt-row"><span>'+esc(bill.billNo)+'</span><span>'+fmtDateTime(bill.date)+'</span></div>'+
   '<div class="receipt-row"><span>'+esc(customerName(bill.customerId))+'</span><span>By '+esc(userName(bill.cashierUserId))+'</span></div>'+
   '<hr class="sep"><table class="receipt-table"><thead><tr><th>Item</th><th>Qty</th><th class="right">Rate</th><th class="right">Amt</th></tr></thead><tbody>'+

function viewBillDetail(id){const b=DB.bills.find(x=>x.id===id); if(!b)return; showReceipt(id);}
function deleteBill(id){
  const b=DB.bills.find(x=>x.id===id); if(!b)return;
  if(!confirm('Delete bill '+b.billNo+'? Stock will be restored.'))return;
  b.items.forEach(li=>{const it=itemById(li.itemId); if(it)it.stock+=li.qty;});
  if(b.udhaarAmount>0&&b.customerId){const c=DB.customers.find(x=>x.id===b.customerId); if(c)c.udhaarBalance=(c.udhaarBalance||0)-b.udhaarAmount;}
  DB.bills=DB.bills.filter(x=>x.id!==id); saveDB(); deleteRecordFromCloud('bills',id); toast('Bill deleted'); renderContent();
}

function savePurchase(){
  const pf=state.purchaseForm;
  const lines=[];
  for(const l of pf.lines){
    const qty=Number(l.qty), cost=Number(l.costPrice);
    if(!qty||qty<=0||isNaN(cost)||cost<0){toast('Enter a valid quantity and cost for every item',true); return;}
    if(l.itemId){
      const it=itemById(l.itemId); if(!it){toast('Item not found',true); return;}
      lines.push({itemId:it.id,qty,costPrice:cost});
    } else {
      const name=(l.newName||'').trim(); const price=Number(l.newPrice);
      if(!name){toast('Enter a name for the new item',true); return;}
      if(isNaN(price)||price<0){toast('Enter a selling price for '+name,true); return;}
      lines.push({itemId:null,newName:name,newCategory:l.newCategory,newUnit:(l.newUnit||'pcs').trim(),newPrice:price,qty,costPrice:cost});
    }
  }
  if(!lines.length){toast('Add at least one item',true); return;}
  const total=lines.reduce((s,l)=>s+l.qty*l.costPrice,0);
  const itemsSnapshot=[];
  lines.forEach(l=>{
    if(l.itemId){
      const it=itemById(l.itemId);
      it.stock+=l.qty; it.costPrice=l.costPrice;
      itemsSnapshot.push({itemId:it.id,name:it.name,unit:it.unit,qty:l.qty,costPrice:l.costPrice});
    } else {
      const newItem=mkItem(l.newName,l.newCategory,l.newUnit,l.newPrice,l.costPrice,l.qty,5,'');
      DB.items.push(newItem);
      itemsSnapshot.push({itemId:newItem.id,name:newItem.name,unit:newItem.unit,qty:l.qty,costPrice:l.costPrice});
    }
  });
  const purRec={id:uid('pur'),date:new Date(pf.date).toISOString(),supplierName:pf.supplierName.trim(),items:itemsSnapshot,total,accountId:pf.accountId,notes:pf.notes.trim()};
  DB.purchases.push(purRec);
  saveDB(); pushRecordToCloud('purchases',purRec); toast('Purchase recorded — inventory updated'); closeModal(); renderContent();
}

/* ================= PERSONAL UDHAR ================= */
function udharKey(e){return e.contactId? ('c:'+e.contactId) : ('n:'+e.personName.trim().toLowerCase());}
function udharTypeLabel(t){return {diya:'Diya (Lent)',liya:'Liya (Borrowed)',wapas_mila:'Wapas Mila (Received back)',wapas_diya:'Wapas Diya (Paid back)'}[t]||t;}
function udharSummary(){
  const map={};
  DB.udharEntries.forEach(e=>{
    const k=udharKey(e);
    if(!map[k])map[k]={key:k,name:e.personName,contactId:e.contactId,balance:0,lastDate:e.date,entries:[]};
    const g=map[k];
    g.name=e.personName;
    if(e.type==='diya')g.balance+=e.amount;
    else if(e.type==='wapas_mila')g.balance-=e.amount;
    else if(e.type==='liya')g.balance-=e.amount;
    else if(e.type==='wapas_diya')g.balance+=e.amount;
    if(new Date(e.date)>new Date(g.lastDate))g.lastDate=e.date;
    g.entries.push(e);
  });
  return Object.values(map).sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance));
}
function udharBalanceForContact(contactId){const g=udharSummary().find(x=>x.contactId===contactId); return g?g.balance:0;}
function viewPersonalUdhar(){
  const people=udharSummary();
  const toReceive=people.filter(p=>p.balance>0).reduce((s,p)=>s+p.balance,0);
  const toPay=people.filter(p=>p.balance<0).reduce((s,p)=>s-p.balance,0);
  return '<div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));">'+
    statTile('Total to Receive',fmtMoney(toReceive),people.filter(p=>p.balance>0).length+' people owe you','good')+
    statTile('Total to Pay',fmtMoney(toPay),people.filter(p=>p.balance<0).length+' people you owe', toPay>0?'bad':'')+
   '</div>'+
   '<p class="muted small" style="margin-top:-6px;">Money you personally lend or borrow — separate from the shop\'s customer udhaar. Only visible to you as admin.</p>'+
   '<div class="card">'+
   '<div class="card-head"><h3>Personal Udhar</h3><button class="btn btn-primary btn-sm" data-action="openAddUdharEntry">'+icon('plus')+' Add Entry</button></div>'+
   (people.length? '<div class="table-wrap"><table><thead><tr><th>Person</th><th></th><th class="right">Balance</th><th></th></tr></thead><tbody>'+
    people.map(p=>'<tr style="cursor:pointer" data-action="viewUdharPerson" data-key="'+esc(p.key)+'"><td>'+esc(p.name)+'</td><td>'+(p.contactId?'<span class="badge badge-muted">Contact</span>':'')+'</td>'+
     '<td class="right num" style="font-weight:600;'+(p.balance>0?'color:var(--success);':p.balance<0?'color:var(--danger);':'')+'">'+(p.balance>0?'Lena: ':p.balance<0?'Dena: ':'Settled ')+(p.balance!==0?fmtMoney(Math.abs(p.balance)):'')+'</td>'+
     '<td class="right"><button class="icon-btn" data-action="viewUdharPerson" data-key="'+esc(p.key)+'">'+icon('search')+'</button></td></tr>').join('')+
    '</tbody></table></div>'
   : '<div class="table-empty">'+emptyState('exchange','No personal udhar recorded','Track money you personally lend to or borrow from people — contacts or anyone else.')+'</div>')+
  '</div>';
}

function viewReminders(){
  const todayStr=todayISO();

  const pending=all.filter(r=>!r.done);
  const overdue=pending.filter(r=>r.date<todayStr);
  const today=pending.filter(r=>r.date===todayStr);
  const upcoming=pending.filter(r=>r.date>todayStr);
  const done=all.filter(r=>r.done);
  const section=(title,list,kind)=>list.length? '<div class="section-title" style="margin-top:16px;">'+title+'</div><div class="table-wrap"><table><tbody>'+
    list.map(r=>reminderRow(r,kind)).join('')+'</tbody></table></div>' : '';

   '<div class="card-pad">'+
   (!all.length? emptyState('bell','No reminders yet','Add a reminder for a date — it will pop up the first time the app is opened that day.') :
    (section('Overdue',overdue,'bad')+section('Today',today,'today')+section('Upcoming',upcoming,'')+section('Done',done,'done'))
   )+
   '</div></div>';

function checkReminders(){
  if(!session)return;
  const todayStr=todayISO();
  const key='reminderPopupShown_'+session.userId;
  let lastShown=null;
  try{lastShown=localStorage.getItem(key);}catch(e){}
  if(lastShown===todayStr)return;
  const due=DB.reminders.filter(r=>!r.done&&r.date<=todayStr);
  try{localStorage.setItem(key,todayStr);}catch(e){}
  if(due.length) showReminderPopup(due);
}
function showReminderPopup(due){
  const sorted=due.slice().sort((a,b)=>a.date.localeCompare(b.date));
  openModal((due.length>1?due.length+' Reminders':'Reminder'),
   '<div style="display:flex;flex-direction:column;gap:12px;">'+sorted.map(r=>{
     const c=r.contactId? DB.contacts.find(x=>x.id===r.contactId) : null;
     const overdue=r.date<todayISO();
     return '<div class="card" style="box-shadow:none;">'+
      '<div class="card-pad">'+
       '<div class="flex-between"><b>'+esc(r.title)+'</b>'+(overdue?'<span class="badge badge-low">Overdue · '+fmtDate(r.date)+'</span>':'<span class="badge badge-muted">'+fmtDate(r.date)+'</span>')+'</div>'+

          '<div class="section-title" style="margin-bottom:6px;">Contact</div>'+
          '<div><b>'+esc(c.name)+'</b></div>'+

      '</div></div>';

  const years=(new Date(f.maturityDate)-new Date(f.startDate))/(365.25*24*3600*1000);

}

  const u=DB.users.find(x=>x.username===username&&x.password===password&&x.active);

  session={userId:u.id}; localStorage.setItem(SESSION_KEY,JSON.stringify(session));

function exportBackup(){
  const data=JSON.stringify(DB,null,2);
  const filename='shop-ledger-backup-'+todayISO()+'.json';
  claude.use('downloads').then(d=>{
    if(!d){ fallbackDownload(filename,data); return; }
    d.save({filename,data}).then(()=>toast('Backup saved')).catch(err=>{
      if(err&&err.code==='declined'){return;}
      fallbackDownload(filename,data);
    });
  }).catch(()=>fallbackDownload(filename,data));
}
function fallbackDownload(filename,data){
  try{
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){toast('Could not download — copy this shop\'s data manually from Settings.',true);}
}
function importBackup(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed.users||!parsed.items){toast('That file does not look like a valid backup',true); return;}
      if(!confirm('This will replace all current data in this browser with the imported backup. Continue?'))return;
      DB=parsed; saveDB(); toast('Backup imported'); session=null; localStorage.removeItem(SESSION_KEY); render();
    }catch(e){toast('Could not read that file',true);}
  };
  reader.readAsText(file);
}

  cartRemove:(ds)=>cartRemove(Number(ds.idx)),
  clearCart:()=>{if(confirm('Clear current bill?')){clearCart();}},
  openManualItem:()=>openManualItem(),
  addPaySplit:()=>addPaySplit(),
  removePaySplit:(ds)=>removePaySplit(Number(ds.idx)),
  openAddPurchase:()=>openAddPurchase(),
  savePurchase:()=>savePurchase(),
  addPurchaseLine:()=>addPurchaseLine(),
  removePurchaseLine:(ds)=>removePurchaseLine(Number(ds.idx)),
  viewPurchaseDetail:(ds)=>viewPurchaseDetail(ds.id),
  setPayMode:(ds)=>setPayMode(ds.mode),
  completeBill:()=>completeBill(),
  posCat:(ds)=>{state.posCat=ds.cat; renderContent();},
  invCat:(ds)=>{state.invCat=ds.cat; renderContent();},
  viewBill:(ds)=>viewBillDetail(ds.id),
  deleteBill:(ds)=>deleteBill(ds.id),
  printBill:(ds)=>printBill(ds.id),
  openAddItem:()=>openAddItem(),
  openEditItem:(ds)=>openEditItem(ds.id),
  deleteItem:(ds)=>deleteItem(ds.id),
  openStockIn:(ds)=>openStockIn(ds.id),
  openAddCustomer:()=>openAddCustomer(),
  openEditCustomer:(ds)=>openEditCustomer(ds.id),
  deleteCustomer:(ds)=>deleteCustomer(ds.id),
  openRecordPayment:(ds)=>openRecordPayment(ds.id),
  openAddContact:()=>openAddContact(),
  openEditContact:(ds)=>openEditContact(ds.id),
  deleteContact:(ds)=>deleteContact(ds.id),
  openAddUdharEntry:()=>openAddUdharEntry(),
  openAddUdharEntryFor:(ds)=>openAddUdharEntryFor(ds.key),
  viewUdharPerson:(ds)=>viewUdharPerson(ds.key),
  openSettleUdhar:(ds)=>openSettleUdhar(ds.key),
  openAddReminder:()=>openAddReminder(),
  openEditReminder:(ds)=>openEditReminder(ds.id),
  deleteReminder:(ds)=>deleteReminder(ds.id),
  toggleReminderDone:(ds)=>toggleReminderDone(ds.id),
  openAddAccount:()=>openAddAccount(),
  openEditAccount:(ds)=>openEditAccount(ds.id),
  deleteAccount:(ds)=>deleteAccount(ds.id),
  openAddExpense:()=>openAddExpense(),
  deleteExpense:(ds)=>deleteExpense(ds.id),
  openAddFD:()=>openAddFD(),
  openEditFD:(ds)=>openEditFD(ds.id),
  deleteFD:(ds)=>deleteFD(ds.id),
  openAddUser:()=>openAddUser(),

};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]'); if(!t)return;
  const fn=ACTIONS[t.dataset.action]; if(fn)fn(t.dataset,e);
});

const FORMS={
  login:(fd)=>login(fd.get('username').trim(),fd.get('password')),
  connectShop:(fd,form)=>{
    if(!cloudReady){toast('Cloud sync is not ready yet — check your internet connection and try again',true); return;}
    const code=fd.get('shopCode').trim().toUpperCase();
    if(!code){return;}
    const btn=form.closest('.modal').querySelector('button[type="submit"]'); if(btn){btn.disabled=true; btn.textContent='Connecting…';}
    pullFromCloud(code).then(cloudDB=>{
      DB=migrateDB(cloudDB);
      localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));
      session=null; localStorage.removeItem(SESSION_KEY);
      closeModal(); toast('Shop connected!'); state.route='login'; render(); checkLicense();
    }).catch(err=>{
      if(btn){btn.disabled=false; btn.textContent='Connect';}
      toast(err&&err.message==='not_found'? 'No shop found with that code — check it and try again':'Could not connect — check your internet and try again',true);
    });
  },
  setupWizard:(fd)=>{
    const shopName=fd.get('shopName').trim(), adminName=fd.get('adminName').trim();
    const username=fd.get('username').trim(), password=fd.get('password');
    if(!shopName||!adminName||!username||!password){toast('Please fill all the required fields',true); return;}
    const finish=(licenseCode,shopCode)=>{
      DB.shopInfo={name:shopName,phone:fd.get('phone').trim(),gst:fd.get('gst').trim(),address:fd.get('address').trim()};
      DB.users.push({id:uid('usr'),name:adminName,username,password,role:'admin',active:true});
      if(fd.get('sampleData')) DB.items=sampleItems();
      DB.shopCode=shopCode; DB.licenseCode=licenseCode;
      DB.setupComplete=true;
      saveDB();
      state.route='login';
      render();
      if(DB.shopCode) showShopCodeModal('Shop Set Up!','Save this code — you\'ll need it to open this same shop on another device (phone, another computer).');
      else toast('Shop set up! Please log in.');
    };
    if(!cloudConfigured()){finish(null,null); return;}
    if(!cloudReady){toast('Connecting to the server — wait a moment and try again',true); return;}
    const lic=normLicense(fd.get('licenseCode'));
    if(!lic){toast('Enter your License Code',true); return;}
    const shopCode=genShopCode();
    const btn=document.querySelector('form[data-form="setupWizard"] button[type="submit"]'); if(btn){btn.disabled=true; btn.textContent='Checking license…';}
    claimLicense(lic,shopCode).then(()=>finish(lic,shopCode)).catch(err=>{
      if(btn){btn.disabled=false; btn.textContent='Start Using Shop Ledger';}
      const m=err&&err.message;
      toast(m==='invalid'?'License code not found — check and try again':m==='disabled'?'This license has been disabled':m==='used'?'This license code is already used':'Could not verify the license — check your internet and try again',true);
    });
  },
  addItem:(fd)=>{
    const bc=fd.get('barcode').trim();
    if(bc&&DB.items.some(x=>x.barcode===bc)){toast('That barcode is already used by another item',true); return;}
    DB.items.push(mkItem(fd.get('name').trim(),fd.get('category'),fd.get('unit').trim(),Number(fd.get('price')),Number(fd.get('costPrice')||0),Number(fd.get('stock')||0),Number(fd.get('lowStockThreshold')||0),bc));
    saveDB(); toast('Item added'); closeModal(); renderContent();
  },
  editItem:(fd,form)=>{
    const it=itemById(form.dataset.id); if(!it)return;
    const bc=fd.get('barcode').trim();
    if(bc&&DB.items.some(x=>x.barcode===bc&&x.id!==it.id)){toast('That barcode is already used by another item',true); return;}
    it.name=fd.get('name').trim(); it.category=fd.get('category'); it.unit=fd.get('unit').trim(); it.price=Number(fd.get('price')); it.costPrice=Number(fd.get('costPrice')||0); it.lowStockThreshold=Number(fd.get('lowStockThreshold')||0); it.barcode=bc;
    saveDB(); toast('Item updated'); closeModal(); renderContent();
  },
  stockIn:(fd,form)=>{const it=itemById(form.dataset.id); if(!it)return; it.stock+=Number(fd.get('qty')); saveDB(); toast('Stock updated'); closeModal(); renderContent();},
  addManualItem:(fd)=>{
    const name=fd.get('name').trim(), price=Number(fd.get('price')), qty=Math.max(1,Number(fd.get('qty')||1));
    if(!name||isNaN(price)){toast('Enter a description and price',true); return;}
    state.cart.push({itemId:null,manual:true,name,unit:'',price,qty});
    closeModal(); renderContent(); toast('Added to bill');
  },
  addCustomer:(fd)=>{DB.customers.push({id:uid('cus'),name:fd.get('name').trim(),phone:fd.get('phone').trim(),udhaarBalance:0}); saveDB(); toast('Customer added'); closeModal(); renderContent();},
  addContact:(fd)=>{DB.contacts.push({id:uid('cnt'),name:fd.get('name').trim(),phone:fd.get('phone').trim(),address:fd.get('address').trim(),remark:fd.get('remark').trim()}); saveDB(); toast('Contact added'); closeModal(); renderContent();},
  editContact:(fd,form)=>{const c=DB.contacts.find(x=>x.id===form.dataset.id); if(!c)return; c.name=fd.get('name').trim(); c.phone=fd.get('phone').trim(); c.address=fd.get('address').trim(); c.remark=fd.get('remark').trim(); saveDB(); toast('Contact updated'); closeModal(); renderContent();},
  addUdharEntry:(fd)=>{
    const contactId=fd.get('contactId')||null;
    let personName=fd.get('personName').trim();
    if(contactId){const c=DB.contacts.find(x=>x.id===contactId); if(c)personName=c.name;}
    if(!personName){toast('Enter a person name or choose a contact',true); return;}
    const amount=Number(fd.get('amount'));
    if(!amount||amount<=0){toast('Enter a valid amount',true); return;}
    DB.udharEntries.push({id:uid('udh'),contactId,personName,type:fd.get('type'),amount,date:new Date(fd.get('date')||todayISO()).toISOString(),notes:fd.get('notes').trim()});
    saveDB(); toast('Entry saved'); closeModal(); renderContent();
  },
  settleUdhar:(fd,form)=>{
    const amount=Number(fd.get('amount'));
    if(!amount||amount<=0){toast('Enter a valid amount',true); return;}
    DB.udharEntries.push({id:uid('udh'),contactId:form.dataset.contactid||null,personName:form.dataset.name,type:fd.get('type'),amount,date:new Date(fd.get('date')||todayISO()).toISOString(),notes:''});
    saveDB(); toast('Payment recorded'); closeModal(); renderContent();
  },
  addReminder:(fd)=>{
    const title=fd.get('title').trim(); if(!title){toast('Enter a title',true); return;}
    DB.reminders.push({id:uid('rem'),title,date:fd.get('date')||todayISO(),contactId:fd.get('contactId')||null,notes:fd.get('notes').trim(),done:false});
    saveDB(); toast('Reminder saved'); closeModal(); renderContent();
  },
  editReminder:(fd,form)=>{
    const r=DB.reminders.find(x=>x.id===form.dataset.id); if(!r)return;
    r.title=fd.get('title').trim(); r.date=fd.get('date')||r.date; r.contactId=fd.get('contactId')||null; r.notes=fd.get('notes').trim();
    saveDB(); toast('Reminder updated'); closeModal(); renderContent();
  },
  editCustomer:(fd,form)=>{const c=DB.customers.find(x=>x.id===form.dataset.id); if(!c)return; c.name=fd.get('name').trim(); c.phone=fd.get('phone').trim(); saveDB(); toast('Customer updated'); closeModal(); renderContent();},
  recordPayment:(fd,form)=>{
    const c=DB.customers.find(x=>x.id===form.dataset.id); if(!c)return;
    const amt=Math.min(Number(fd.get('amount')),c.udhaarBalance);
    c.udhaarBalance-=amt; DB.udhaarPayments.push({id:uid('pay'),customerId:c.id,date:new Date().toISOString(),amount:amt,accountId:fd.get('accountId')});
    saveDB(); toast('Payment recorded'); closeModal(); renderContent();
  },
  addAccount:(fd)=>{DB.accounts.push({id:uid('acc'),name:fd.get('name').trim(),type:fd.get('type')}); saveDB(); toast('Account added'); closeModal(); renderContent();},
  editAccount:(fd,form)=>{const a=DB.accounts.find(x=>x.id===form.dataset.id); if(!a)return; a.name=fd.get('name').trim(); a.type=fd.get('type'); saveDB(); toast('Account updated'); closeModal(); renderContent();},
  addExpense:(fd)=>{const rec={id:uid('exp'),date:new Date(fd.get('date')).toISOString(),category:fd.get('category'),amount:Number(fd.get('amount')),accountId:fd.get('accountId'),description:fd.get('description').trim()}; DB.expenses.push(rec); saveDB(); pushRecordToCloud('expenses',rec); toast('Expense added'); closeModal(); renderContent();},
  addFD:(fd)=>{DB.fds.push({id:uid('fd'),bankName:fd.get('bankName').trim(),fdNumber:fd.get('fdNumber').trim(),amount:Number(fd.get('amount')),interestRate:Number(fd.get('interestRate')||0),startDate:fd.get('startDate'),maturityDate:fd.get('maturityDate'),notes:fd.get('notes').trim()}); saveDB(); toast('FD added'); closeModal(); renderContent();},
  editFD:(fd,form)=>{const f=DB.fds.find(x=>x.id===form.dataset.id); if(!f)return; Object.assign(f,{bankName:fd.get('bankName').trim(),fdNumber:fd.get('fdNumber').trim(),amount:Number(fd.get('amount')),interestRate:Number(fd.get('interestRate')||0),startDate:fd.get('startDate'),maturityDate:fd.get('maturityDate'),notes:fd.get('notes').trim()}); saveDB(); toast('FD updated'); closeModal(); renderContent();},
  addUser:(fd)=>{
    if(DB.users.some(u=>u.username===fd.get('username').trim())){toast('Username already exists',true); return;}
    DB.users.push({id:uid('usr'),name:fd.get('name').trim(),username:fd.get('username').trim(),password:fd.get('password'),role:fd.get('role'),active:true});
    saveDB(); toast('Login created'); closeModal(); renderContent();
  },
  editUser:(fd,form)=>{
    const u=DB.users.find(x=>x.id===form.dataset.id); if(!u)return;
    const newUsername=fd.get('username').trim();
    if(DB.users.some(x=>x.username===newUsername&&x.id!==u.id)){toast('Username already exists',true); return;}
    u.name=fd.get('name').trim(); u.username=newUsername; u.role=fd.get('role'); const pw=fd.get('password'); if(pw)u.password=pw;
    saveDB(); toast('Login updated'); closeModal(); renderContent();
  },
  shopInfo:(fd)=>{DB.shopInfo={name:fd.get('name').trim(),phone:fd.get('phone').trim(),gst:fd.get('gst').trim(),address:fd.get('address').trim()}; saveDB(); toast('Shop info saved'); render();},
};
document.addEventListener('submit',e=>{
  const form=e.target.closest('[data-form]'); if(!form)return;
  e.preventDefault();
  const name=form.dataset.form; const fn=FORMS[name]; if(!fn)return;
  fn(new FormData(form),form);
});

render();
checkReminders();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&cloudReady&&DB.shopCode&&session){
    pullFromCloud(DB.shopCode).then(cloudDB=>{DB=migrateDB(cloudDB); localStorage.setItem(STORAGE_KEY,JSON.stringify(DB)); render(); checkLicense();}).catch(()=>{});
  }
});

/* ================= install as app (PWA) ================= */
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  if(session)renderContent();
});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null; if(session)renderContent();});
function canInstallApp(){return !!deferredInstallPrompt;}
function installApp(){
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null; renderContent();});
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('service-worker.js').catch(()=>{});});
}
</script>
